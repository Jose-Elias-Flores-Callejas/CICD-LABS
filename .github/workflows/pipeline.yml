name: Primer Pipeline CI

# Se ejecuta en cada push (cualquier rama) y al crear/actualizar pull requests hacia main
on:
  push:
  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar información del entorno
        run: |
          echo "================================"
          echo "      PRIMER PIPELINE CI"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================"

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Etapa 1 - Compilación de la aplicación
        run: |
          python -m compileall -q app/
          echo "Compilacion exitosa"

      - name: Etapa 2 - Pruebas unitarias con cobertura
        run: |
          mkdir -p reports
          python -m pytest app/tests -v \
            --junitxml=reports/reporte-pruebas.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:reports/cobertura/ \
            --cov-report=xml:reports/cobertura.xml
          echo "Pruebas unitarias exitosas"

      - name: Publicar reporte de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reports/reporte-pruebas.xml

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: |
            reports/cobertura.xml
            reports/cobertura/

      - name: Finalizar pipeline
        run: echo "Pipeline ejecutado correctamente."