name: Primer Pipeline CI

# Se ejecuta en cada push (cualquier rama) y al crear/actualizar pull requests hacia main
on:
  push:
  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar información del entorno
        run: |
          echo "================================"
          echo "      PRIMER PIPELINE CI"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================"

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      - name: Fallo deliberado (experimento Laboratorio 2)
        run: exit 1

      - name: Finalizar pipeline
        run: echo "Pipeline ejecutado correctamente."